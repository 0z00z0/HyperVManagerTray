name: CI

# Build + unit tests on every push and PR to master. Keeps the release path
# (release.yml) lean — this catches regressions continuously, not only at release.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  # The shared ZeroZero components come from the studio's GitHub Packages feed, which authenticates
  # every read — an anonymous request returns 401. This is what the run's GITHUB_TOKEN needs to
  # restore them.
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    env:
      # The feed credential, handed to NuGet through the environment rather than written into a
      # config file: NuGet reads NuGetPackageSourceCredentials_<source name> for the source of that
      # name, and the name here is the one nuget.config gives the studio feed. Job-scoped, so the
      # test step is authenticated too. Nothing is added to, or rewritten in, any NuGet.Config.
      #
      # The run's own GITHUB_TOKEN is the default and needs no secret, but it can read the feed only
      # where the ZeroZero.* packages admit this repository — measured: while they are published
      # private and granted to 0z0-shared alone, every request returns 403 with a valid token.
      # PACKAGES_READ_TOKEN is the way out that needs no change on the publishing side: set it to a
      # token carrying read:packages and it is taken instead. An absent secret is an empty string,
      # so the fallback below picks the run token.
      NuGetPackageSourceCredentials_0z00z0: Username=${{ github.actor }};Password=${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      # The app targets win-x64 and does ReadyToRun on Release, which needs the
      # win-x64 runtime pack — so restore/build must specify the RID (NETSDK1112).
      - name: Restore
        run: dotnet restore HyperVManagerTray.csproj -r win-x64

      - name: Build (Release)
        run: dotnet build HyperVManagerTray.csproj -c Release -r win-x64 --no-restore --nologo

      - name: Unit tests
        run: dotnet test Tests\HyperVManagerTray.Tests.csproj -c Release --nologo
